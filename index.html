<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Lịch Trình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F6F5F0;
    --paper-raised:#FFFFFF;
    --ink:#20232B;
    --ink-soft:#5B5F6B;
    --line:#DEDCD3;
    --accent:#3457D5;
    --accent-soft:#E7EBFB;
    --amber:#C9840A;
    --amber-soft:#FBF0DC;
    --green:#2F7D5C;
    --green-soft:#E1F0E8;
    --red:#C13F3F;
    --red-soft:#FBE6E6;
    --grey-chip:#EDEBE3;
    --radius:10px;
    --shadow: 0 1px 2px rgba(32,35,43,0.05), 0 4px 14px rgba(32,35,43,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* Header */
  header.app-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:26px;flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:500;
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;
    margin:0;letter-spacing:-0.01em;
  }
  .today-tag{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);
    border:1px solid var(--line);background:var(--paper-raised);
    padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:7px;
  }
  .today-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

  /* Stat cards */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;
  }
  .stat-card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1;}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .stat-card.accent .num{color:var(--accent);}
  .stat-card.amber .num{color:var(--amber);}
  .stat-card.green .num{color:var(--green);}
  .stat-card.red .num{color:var(--red);}
  .bar-track{height:5px;background:var(--grey-chip);border-radius:4px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;}

  /* Toolbar */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    margin-bottom:16px;flex-wrap:wrap;
  }
  .tabs{display:flex;gap:4px;background:var(--paper-raised);border:1px solid var(--line);
    padding:3px;border-radius:999px;}
  .tab{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 15px;border-radius:999px;
    cursor:pointer;color:var(--ink-soft);user-select:none;transition:.15s;
  }
  .tab.active{background:var(--ink);color:var(--paper-raised);}
  .toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  select.filter{
    font-family:'IBM Plex Sans';font-size:13px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);
  }
  .btn-add{
    font-family:'IBM Plex Sans';font-weight:600;font-size:13.5px;
    background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);
  }
  .btn-add:hover{filter:brightness(1.06);}

  /* Empty state */
  .empty{
    text-align:center;padding:70px 20px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:var(--radius);background:var(--paper-raised);
  }
  .empty h3{font-family:'Space Grotesk';color:var(--ink);margin-bottom:6px;}

  /* ===== Timeline / Runway view ===== */
  .runway{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .runway-scroll{overflow-x:auto;}
  .runway-head{
    display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper-raised);z-index:2;
  }
  .runway-labelcol{
    width:220px;min-width:220px;flex-shrink:0;border-right:1px solid var(--line);
    padding:10px 14px;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;
    position:sticky;left:0;background:var(--paper-raised);z-index:3;
  }
  .runway-days{display:flex;}
  .runway-day{
    width:38px;min-width:38px;text-align:center;padding:8px 0 6px;
    font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);border-right:1px solid var(--line);
  }
  .runway-day.today{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .runway-day.weekend{background:#FBFAF6;}
  .runway-day .dow{display:block;font-size:9px;opacity:.7;margin-bottom:2px;}
  .runway-row{display:flex;border-bottom:1px solid var(--line);}
  .runway-row:last-child{border-bottom:none;}
  .runway-taskname{
    width:220px;min-width:220px;flex-shrink:0;border-right:1px solid var(--line);
    padding:12px 14px;position:sticky;left:0;background:var(--paper-raised);z-index:1;
  }
  .runway-taskname .t-title{font-size:13.5px;font-weight:600;margin-bottom:3px;}
  .runway-taskname .t-project{font-size:11.5px;color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:5px;}
  .runway-taskname .t-project .sw{width:7px;height:7px;border-radius:2px;}
  .runway-lane{position:relative;flex:1;background-image:repeating-linear-gradient(to right, transparent, transparent 37px, var(--line) 37px, var(--line) 38px);}
  .runway-lane .lane-inner{position:relative;height:100%;min-height:52px;}
  .runway-bar{
    position:absolute;top:12px;height:26px;border-radius:6px;
    display:flex;align-items:center;padding:0 8px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer;
  }
  .runway-bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35);}
  .runway-bar span{position:relative;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;}

  /* ===== Board view ===== */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .board-col{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;min-height:200px;box-shadow:var(--shadow);}
  .board-col h4{
    font-family:'IBM Plex Mono';font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:2px 6px 12px;display:flex;justify-content:space-between;align-items:center;
  }
  .board-col h4 .count{background:var(--grey-chip);color:var(--ink);border-radius:999px;
    padding:1px 8px;font-size:11px;}
  .board-col.col-overdue{border-color:var(--red);}
  .board-col.col-overdue h4{color:var(--red);}
  .board-col.col-overdue h4 .count{background:var(--red-soft);color:var(--red);}
  .board-col-body{min-height:60px;border-radius:8px;transition:background .12s,outline .12s;}
  .board-col.drag-over .board-col-body{
    outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);
  }
  .board-col.col-overdue.drag-over .board-col-body{
    outline:2px dashed var(--red);background:var(--red-soft);
  }
  @media (max-width:980px){
    .board{grid-template-columns:repeat(2,1fr);}
  }
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 12px;
    margin-bottom:9px;cursor:grab;transition:.15s;
  }
  .card:active{cursor:grabbing;}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .card.dragging{opacity:.4;transform:scale(.98);}
  .card .c-title{font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .card .c-desc{
    font-size:12px;color:var(--ink-soft);margin:-2px 0 8px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .c-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .chip{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap;}
  .chip.pr-high{background:var(--red-soft);color:var(--red);}
  .chip.pr-med{background:var(--amber-soft);color:var(--amber);}
  .chip.pr-low{background:var(--green-soft);color:var(--green);}
  .card .c-date{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink-soft);}

  /* Màu thẻ theo trạng thái/hạn chót */
  .card.card-blue{background:var(--accent-soft);border-color:var(--accent);}
  .card.card-blue .c-date{color:#2A3D9E;}
  .card.card-yellow{background:var(--amber-soft);border-color:var(--amber);}
  .card.card-yellow .c-date{color:#8C6208;}
  .card.card-green{background:var(--green-soft);border-color:var(--green);}
  .card.card-green .c-date{color:var(--green);}
  .card.card-red{background:var(--red-soft);border-color:var(--red);}
  .card.card-red .c-date{color:var(--red);}

  /* ===== List view ===== */
  table.tasklist{width:100%;border-collapse:collapse;background:var(--paper-raised);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  table.tasklist th{
    text-align:left;font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);padding:11px 14px;border-bottom:1px solid var(--line);
    background:#FBFAF6;
  }
  table.tasklist td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  table.tasklist tr:last-child td{border-bottom:none;}
  table.tasklist tr:hover td{background:#FCFBF8;}
  .status-pill{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;}
  .status-todo{background:var(--grey-chip);color:var(--ink-soft);}
  .status-doing{background:var(--accent-soft);color:var(--accent);}
  .status-done{background:var(--green-soft);color:var(--green);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;border-radius:6px;}
  .icon-btn:hover{background:var(--grey-chip);color:var(--ink);}

  /* ===== Modal ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(32,35,43,.4);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper-raised);border-radius:14px;width:100%;max-width:460px;
    padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);
    max-height:90vh;overflow-y:auto;transition:max-width .15s ease;
  }
  .modal.wide{max-width:640px;}
  .modal h3{font-family:'Space Grotesk';margin:0 0 16px;font-size:19px;}
  .modal-body{display:flex;flex-direction:column;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:'IBM Plex Sans';font-size:13.5px;background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;line-height:1.5;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}
  .btn-secondary{
    background:none;border:1px solid var(--line);padding:9px 15px;border-radius:8px;
    cursor:pointer;font-size:13px;color:var(--ink-soft);font-weight:500;
  }
  .btn-danger{color:var(--red);border-color:var(--red-soft);}
  .btn-primary{
    background:var(--ink);color:#fff;border:none;padding:9px 18px;border-radius:8px;
    cursor:pointer;font-size:13px;font-weight:600;
  }
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;}

  /* ===== Modal extra: subtasks / comments / activity (chỉ hiện khi bấm vào task) ===== */
  .modal-extra{margin-top:6px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:20px;}
  .extra-section h4{
    font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .extra-section h4 .count{
    background:var(--grey-chip);color:var(--ink);border-radius:999px;padding:1px 8px;
    font-size:10.5px;font-family:'IBM Plex Sans';font-weight:600;
  }
  .extra-section h4 .hint-tag{
    font-family:'IBM Plex Sans';font-size:10.5px;text-transform:none;letter-spacing:0;
    color:var(--ink-soft);font-weight:400;
  }
  .empty-hint{font-size:12px;color:var(--ink-soft);padding:6px 0;}

  .subtask-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);}
  .subtask-row:last-child{border-bottom:none;}
  .subtask-check{display:flex;align-items:center;gap:8px;flex:1;font-size:13px;cursor:pointer;min-width:0;}
  .subtask-check input{width:auto;}
  .subtask-check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subtask-row.done .subtask-check span{text-decoration:line-through;color:var(--ink-soft);}
  .subtask-due{width:128px;flex-shrink:0;font-size:12px;padding:5px 7px;}
  .subtask-del{color:var(--red);flex-shrink:0;}
  .subtask-add-row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .subtask-add-row input[type="text"]{flex:1;min-width:140px;}
  .subtask-add-row input[type="date"]{width:128px;}
  .subtask-add-row button{
    font-family:'IBM Plex Sans';font-weight:600;font-size:12.5px;background:var(--ink);color:#fff;
    border:none;padding:0 13px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }

  .comment-list{max-height:180px;overflow-y:auto;}
  .comment-row{padding:8px 0;border-bottom:1px solid var(--line);}
  .comment-row:last-child{border-bottom:none;}
  .comment-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .comment-time{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  .comment-add-row{display:flex;gap:7px;margin-top:9px;align-items:flex-start;}
  .comment-add-row textarea{flex:1;min-height:44px;}
  .comment-add-row button{
    font-family:'IBM Plex Sans';font-weight:600;font-size:12.5px;background:var(--accent);color:#fff;
    border:none;padding:0 15px;height:38px;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  }

  .activity-log{max-height:170px;overflow-y:auto;}
  .activity-row{display:flex;gap:9px;padding:6px 0;}
  .activity-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;}
  .activity-text{font-size:12.5px;line-height:1.4;}
  .activity-time{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

  .note{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .footer-note{
    text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:30px;
    font-family:'IBM Plex Mono';
  }
  .banner{
    padding:11px 15px;border-radius:9px;font-size:12.5px;margin-bottom:18px;
    border:1px solid;line-height:1.6;
  }
  .banner.setup{background:var(--accent-soft);border-color:var(--accent);color:#2A3D9E;}
  .banner.error{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .banner code{
    background:rgba(0,0,0,.07);padding:1px 6px;border-radius:5px;
    font-family:'IBM Plex Mono';font-size:11.5px;
  }
  .banner pre{
    background:rgba(0,0,0,.06);padding:10px 12px;border-radius:7px;
    font-family:'IBM Plex Mono';font-size:11px;overflow-x:auto;margin:8px 0 2px;
    white-space:pre;
  }
  .banner .banner-close{
    float:right;background:none;border:none;cursor:pointer;color:inherit;
    font-size:14px;line-height:1;opacity:.6;padding:2px;
  }
  .banner .banner-close:hover{opacity:1;}
  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .board{grid-template-columns:1fr;}
    table.tasklist{font-size:12px;}
    .field-row{flex-direction:column;}
    .modal.wide{max-width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="brand">
      <div class="eyebrow">Bảng điều phối công việc</div>
      <h1>Lịch trình &amp; Tiến độ công việc</h1>
    </div>
    <div class="today-tag"><span class="dot"></span><span id="todayLabel"></span></div>
  </header>

  <div id="backendBanner" class="banner" style="display:none;"></div>

  <div class="stats" id="statsRow"></div>

  <div class="toolbar">
    <div class="tabs" id="viewTabs">
      <div class="tab active" data-view="runway">Dòng thời gian</div>
      <div class="tab" data-view="board">Bảng Kanban</div>
      <div class="tab" data-view="list">Danh sách</div>
    </div>
    <div class="toolbar-right">
      <select class="filter" id="filterProject"></select>
      <select class="filter" id="filterStatus">
        <option value="all">Tất cả trạng thái</option>
        <option value="todo">Chưa làm</option>
        <option value="doing">Đang làm</option>
        <option value="overdue">Chậm deadline</option>
        <option value="done">Hoàn thành</option>
      </select>
      <button class="btn-secondary" id="exportBtn">⬇ Xuất Excel</button>
      <button class="btn-add" id="openAdd">+ Thêm công việc</button>
    </div>
  </div>

  <div id="viewRoot"></div>

</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modalBox">
    <h3 id="modalTitle">Thêm công việc</h3>
    <div class="modal-body">
      <div class="field">
        <label>Tên công việc</label>
        <input type="text" id="f-title" placeholder="VD: Thiết kế bộ nhận diện thương hiệu">
      </div>
      <div class="field">
        <label>Dự án / Nhóm</label>
        <input type="text" id="f-project" placeholder="VD: Dự án A">
      </div>
      <div class="field">
        <label>Mô tả nội dung</label>
        <textarea id="f-desc" rows="3" placeholder="Mô tả chi tiết công việc cần làm..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Ngày bắt đầu</label>
          <input type="date" id="f-start">
        </div>
        <div class="field">
          <label>Hạn hoàn thành</label>
          <input type="date" id="f-due">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Mức ưu tiên</label>
          <select id="f-priority">
            <option value="low">Thấp</option>
            <option value="med" selected>Trung bình</option>
            <option value="high">Cao</option>
          </select>
        </div>
        <div class="field">
          <label>Trạng thái</label>
          <select id="f-status">
            <option value="todo">Chưa làm</option>
            <option value="doing" selected>Đang làm</option>
            <option value="done">Hoàn thành</option>
          </select>
        </div>
      </div>

      <!-- Các phần dưới đây CHỈ hiện khi mở một công việc đã tồn tại (bấm vào task) -->
      <div class="modal-extra" id="modalExtra" style="display:none;">

        <div class="extra-section">
          <h4>Công việc con <span class="count" id="subtaskCount"></span></h4>
          <div id="subtaskList"></div>
          <div class="subtask-add-row">
            <input type="text" id="newSubtaskTitle" placeholder="Tên công việc con">
            <input type="date" id="newSubtaskDue">
            <button type="button" id="addSubtaskBtn">+ Thêm</button>
          </div>
          <div class="note">Hạn công việc chính sẽ tự động dời ra nếu công việc con có hạn muộn hơn.</div>
        </div>

        <div class="extra-section">
          <h4>Bình luận</h4>
          <div id="commentList" class="comment-list"></div>
          <div class="comment-add-row">
            <textarea id="newCommentText" placeholder="Viết bình luận..."></textarea>
            <button type="button" id="addCommentBtn">Gửi</button>
          </div>
        </div>

        <div class="extra-section">
          <h4>Lịch sử chỉnh sửa <span class="hint-tag">— tự động ghi nhận theo thời gian thực, không thể chỉnh sửa</span></h4>
          <div id="activityList" class="activity-log"></div>
        </div>

      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary btn-danger" id="deleteBtn" style="display:none;">Xoá</button>
      <div style="flex:1"></div>
      <button class="btn-secondary" id="cancelBtn">Huỷ</button>
      <button class="btn-primary" id="saveBtn">Lưu</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ====== CẤU HÌNH BACKEND (Supabase) ======
  // 1. Tạo project miễn phí tại https://supabase.com
  // 2. Vào SQL Editor, chạy đoạn SQL tạo bảng "tasks" + các policy RLS (xem banner lỗi trong app nếu thiếu)
  // 3. Vào Project Settings → API, copy "Project URL" và "anon public key" dán vào 2 dòng dưới đây
  const SUPABASE_URL = 'https://gqvkdyfoqypkycrbtxwg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_D6W_s3jVs60xBuEdfuWjUg_ak6hBQgg';
  const BACKEND_READY = !SUPABASE_URL.includes('YOUR_SUPABASE_URL') && !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY');
  const db = (BACKEND_READY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  // SQL gợi ý để bật quyền cho role "anon" khi app chưa có đăng nhập
  const RLS_FIX_SQL =
`alter table tasks enable row level security;

create policy "Cho phép đọc" on tasks
for select using (true);

create policy "Cho phép thêm" on tasks
for insert with check (true);

create policy "Cho phép sửa" on tasks
for update using (true);

create policy "Cho phép xoá" on tasks
for delete using (true);`;

  // SQL gợi ý để thêm các cột mới phục vụ Công việc con / Bình luận / Lịch sử chỉnh sửa
  const SCHEMA_FIX_SQL =
`alter table tasks add column if not exists subtasks jsonb not null default '[]'::jsonb;
alter table tasks add column if not exists comments jsonb not null default '[]'::jsonb;
alter table tasks add column if not exists activity jsonb not null default '[]'::jsonb;`;

  const PROJECT_COLORS = ['#3457D5','#C9840A','#2F7D5C','#8E4EC6','#C13F3F','#0E7C86','#A6570E'];
  let tasks = [];
  let currentView = 'runway';
  let editingId = null;

  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

  function fmtDate(d){
    if(!d) return '—';
    return new Date(d+'T00:00:00').toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
  }
  function fmtDateTime(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function nowISO(){ return new Date().toISOString(); }
  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a,b){
    return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
  }
  function projectColor(name){
    let hash=0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
    return PROJECT_COLORS[Math.abs(hash) % PROJECT_COLORS.length];
  }
  function uid(){ return 't_' + Math.random().toString(36).slice(2,10); }

  // Số ngày còn lại được tính là "sắp tới hạn" (vàng) khi chưa quá hạn
  const DUE_SOON_DAYS = 2;
  function cardColorKey(t){
    if(t.status === 'done') return 'green';
    const today = todayStr();
    if(t.due < today) return 'red';
    if(daysBetween(today, t.due) <= DUE_SOON_DAYS) return 'yellow';
    return 'blue';
  }

  function showBanner(type, html, closable){
    const el = $('#backendBanner');
    el.className = 'banner ' + type;
    el.innerHTML = (closable ? '<button class="banner-close" title="Đóng">✕</button>' : '') + html;
    el.style.display = 'block';
    if(closable){
      el.querySelector('.banner-close').addEventListener('click', hideBanner);
    }
  }
  function hideBanner(){ $('#backendBanner').style.display = 'none'; }

  // Nhận diện các lỗi RLS phổ biến của Supabase/Postgres và hiển thị hướng dẫn sửa ngay trong app
  function isRlsError(err){
    const msg = (err && err.message) ? err.message.toLowerCase() : '';
    return msg.includes('row-level security') || msg.includes('row level security') || err?.code === '42501';
  }
  function showRlsBanner(){
    showBanner('error',
      `<strong>Thiếu quyền ghi dữ liệu (Row-Level Security).</strong> Bảng <code>tasks</code> trên Supabase đã bật RLS nhưng chưa có policy cho phép thêm/sửa/xoá.
      Vào <strong>Supabase → SQL Editor</strong> và chạy đoạn SQL sau, rồi thử lại:
      <pre>${escapeHtml(RLS_FIX_SQL)}</pre>`,
      true
    );
  }

  // Nhận diện lỗi thiếu cột (subtasks / comments / activity) và hiển thị hướng dẫn sửa
  function isMissingColumnError(err){
    const msg = (err && err.message) ? err.message.toLowerCase() : '';
    return (msg.includes('column') && msg.includes('does not exist')) || err?.code === '42703';
  }
  function showSchemaBanner(){
    showBanner('error',
      `<strong>Thiếu cột dữ liệu cho Công việc con / Bình luận / Lịch sử chỉnh sửa.</strong>
      Vào <strong>Supabase → SQL Editor</strong> và chạy đoạn SQL sau, rồi thử lại:
      <pre>${escapeHtml(SCHEMA_FIX_SQL)}</pre>`,
      true
    );
  }

  function rowToTask(r){
    return {
      id:r.id, title:r.title, project:r.project, description:r.description || '',
      start:r.start_date, due:r.due_date, priority:r.priority, status:r.status,
      subtasks: r.subtasks || [], comments: r.comments || [], activity: r.activity || []
    };
  }
  function taskToRow(t){
    return {
      title:t.title, project:t.project, description:t.description || '',
      start_date:t.start, due_date:t.due, priority:t.priority, status:t.status,
      subtasks: t.subtasks || [], comments: t.comments || [], activity: t.activity || []
    };
  }

  async function loadTasks(){
    if(db){
      try{
        const {data, error} = await db.from('tasks').select('*').order('due_date', {ascending:true});
        if(error) throw error;
        tasks = (data || []).map(rowToTask);
        hideBanner();
      }catch(e){
        console.error('Lỗi tải dữ liệu:', e);
        tasks = [];
        if(isRlsError(e)){
          showRlsBanner();
        } else if(isMissingColumnError(e)){
          showSchemaBanner();
        } else {
          showBanner('error', 'Không kết nối được tới backend Supabase. Kiểm tra lại URL/Key, hoặc chắc chắn đã tạo bảng <code>tasks</code> đúng cấu trúc.', true);
        }
      }
    } else {
      tasks = seedTasks();
      showBanner('setup', 'Chưa cấu hình backend — đang hiển thị dữ liệu mẫu chỉ lưu tạm trên trình duyệt này. Dán <code>SUPABASE_URL</code> và <code>SUPABASE_ANON_KEY</code> vào đầu file để đồng bộ dữ liệu qua nhiều thiết bị.', true);
    }
    render();
  }

  async function addTaskRemote(fields){
    if(db){
      const {data, error} = await db.from('tasks').insert(taskToRow(fields)).select().single();
      if(error){
        if(isRlsError(error)) showRlsBanner();
        else if(isMissingColumnError(error)) showSchemaBanner();
        else alert('Lỗi khi lưu công việc: ' + error.message);
        return null;
      }
      return rowToTask(data);
    }
    return {id: uid(), ...fields};
  }
  async function updateTaskRemote(id, fields){
    if(db){
      const {error} = await db.from('tasks').update(taskToRow(fields)).eq('id', id);
      if(error){
        if(isRlsError(error)) showRlsBanner();
        else if(isMissingColumnError(error)) showSchemaBanner();
        else alert('Lỗi khi cập nhật công việc: ' + error.message);
        return false;
      }
    }
    return true;
  }
  async function deleteTaskRemote(id){
    if(db){
      const {error} = await db.from('tasks').delete().eq('id', id);
      if(error){
        if(isRlsError(error)) showRlsBanner();
        else if(isMissingColumnError(error)) showSchemaBanner();
        else alert('Lỗi khi xoá công việc: ' + error.message);
        return false;
      }
    }
    return true;
  }

  // ---------- Công việc con / Bình luận / Lịch sử chỉnh sửa ----------
  function addActivity(t, text){
    t.activity = [...(t.activity||[]), {id:uid(), text, time: nowISO()}];
  }

  // Sub-task ảnh hưởng trực tiếp đến hạn của task chính: nếu công việc con có hạn muộn hơn
  // hạn hiện tại của task chính, hạn task chính sẽ tự động dời ra (chỉ dời ra, không tự rút ngắn lại).
  function syncTaskDueWithSubtasks(t){
    const subDues = (t.subtasks||[]).map(s=>s.due).filter(Boolean);
    if(subDues.length===0) return false;
    const maxSubDue = subDues.reduce((m,d)=> d>m?d:m, subDues[0]);
    if(maxSubDue > t.due){
      const old = t.due;
      t.due = maxSubDue;
      addActivity(t, `Hạn hoàn thành tự động dời từ ${fmtDate(old)} sang ${fmtDate(maxSubDue)} do công việc con.`);
      return true;
    }
    return false;
  }

  async function persistTaskExtra(t){
    return await updateTaskRemote(t.id, t);
  }

  function renderModalExtra(t){
    // --- Công việc con ---
    const subs = t.subtasks || [];
    const doneCount = subs.filter(s=>s.done).length;
    $('#subtaskCount').textContent = subs.length ? `${doneCount}/${subs.length}` : '';
    $('#subtaskList').innerHTML = subs.length ? subs.map(s=>`
      <div class="subtask-row ${s.done?'done':''}">
        <label class="subtask-check">
          <input type="checkbox" data-sub="${s.id}" ${s.done?'checked':''}>
          <span>${escapeHtml(s.title)}</span>
        </label>
        <input type="date" class="subtask-due" data-sub-due="${s.id}" value="${s.due||''}">
        <button type="button" class="icon-btn subtask-del" data-sub-del="${s.id}" title="Xoá công việc con">✕</button>
      </div>
    `).join('') : `<div class="empty-hint">Chưa có công việc con.</div>`;

    $$('#subtaskList input[type="checkbox"]').forEach(cb=>{
      cb.addEventListener('change', ()=> toggleSubtaskDone(cb.dataset.sub));
    });
    $$('#subtaskList .subtask-due').forEach(inp=>{
      inp.addEventListener('change', ()=> updateSubtaskDue(inp.dataset.subDue, inp.value));
    });
    $$('#subtaskList .subtask-del').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteSubtask(btn.dataset.subDel));
    });

    // --- Bình luận (mới nhất trước) ---
    const comments = [...(t.comments||[])].sort((a,b)=> b.time.localeCompare(a.time));
    $('#commentList').innerHTML = comments.length ? comments.map(c=>`
      <div class="comment-row">
        <div class="comment-text">${escapeHtml(c.text)}</div>
        <div class="comment-time">${fmtDateTime(c.time)}</div>
      </div>
    `).join('') : `<div class="empty-hint">Chưa có bình luận nào.</div>`;

    // --- Lịch sử chỉnh sửa (chỉ đọc, tự động ghi nhận, mới nhất trước) ---
    const activity = [...(t.activity||[])].sort((a,b)=> b.time.localeCompare(a.time));
    $('#activityList').innerHTML = activity.length ? activity.map(a=>`
      <div class="activity-row">
        <span class="activity-dot"></span>
        <div>
          <div class="activity-text">${escapeHtml(a.text)}</div>
          <div class="activity-time">${fmtDateTime(a.time)}</div>
        </div>
      </div>
    `).join('') : `<div class="empty-hint">Chưa có hoạt động nào.</div>`;
  }

  async function handleAddSubtask(){
    const t = tasks.find(x=>x.id===editingId);
    if(!t) return;
    const titleInput = $('#newSubtaskTitle');
    const dueInput = $('#newSubtaskDue');
    const title = titleInput.value.trim();
    if(!title){ titleInput.focus(); return; }
    const due = dueInput.value || '';
    const sub = {id:uid(), title, due, done:false};
    t.subtasks = [...(t.subtasks||[]), sub];
    addActivity(t, `Thêm công việc con "${title}"${due?` (hạn ${fmtDate(due)})`:''}.`);
    const extended = syncTaskDueWithSubtasks(t);
    const ok = await persistTaskExtra(t);
    if(ok){
      titleInput.value=''; dueInput.value='';
      renderModalExtra(t);
      if(extended) $('#f-due').value = t.due;
      render();
    }
  }

  async function toggleSubtaskDone(subId){
    const t = tasks.find(x=>x.id===editingId);
    if(!t) return;
    const s = (t.subtasks||[]).find(x=>x.id===subId);
    if(!s) return;
    s.done = !s.done;
    addActivity(t, `${s.done?'Hoàn thành':'Bỏ đánh dấu hoàn thành'} công việc con "${s.title}".`);
    const ok = await persistTaskExtra(t);
    if(ok) renderModalExtra(t);
  }

  async function updateSubtaskDue(subId, newDue){
    const t = tasks.find(x=>x.id===editingId);
    if(!t) return;
    const s = (t.subtasks||[]).find(x=>x.id===subId);
    if(!s) return;
    const old = s.due;
    s.due = newDue;
    addActivity(t, `Đổi hạn công việc con "${s.title}": ${old?fmtDate(old):'—'} → ${newDue?fmtDate(newDue):'—'}.`);
    const extended = syncTaskDueWithSubtasks(t);
    const ok = await persistTaskExtra(t);
    if(ok){
      renderModalExtra(t);
      if(extended) $('#f-due').value = t.due;
      render();
    }
  }

  async function deleteSubtask(subId){
    const t = tasks.find(x=>x.id===editingId);
    if(!t) return;
    const s = (t.subtasks||[]).find(x=>x.id===subId);
    t.subtasks = (t.subtasks||[]).filter(x=>x.id!==subId);
    if(s) addActivity(t, `Xoá công việc con "${s.title}".`);
    const ok = await persistTaskExtra(t);
    if(ok) renderModalExtra(t);
  }

  async function handleAddComment(){
    const t = tasks.find(x=>x.id===editingId);
    if(!t) return;
    const input = $('#newCommentText');
    const text = input.value.trim();
    if(!text){ input.focus(); return; }
    const c = {id:uid(), text, time: nowISO()};
    t.comments = [...(t.comments||[]), c];
    addActivity(t, `Đã thêm bình luận.`);
    const ok = await persistTaskExtra(t);
    if(ok){
      input.value='';
      renderModalExtra(t);
    }
  }

  function diffActivity(oldT, newFields){
    const notes = [];
    if(oldT.title !== newFields.title) notes.push(`Đổi tên công việc thành "${newFields.title}".`);
    if(oldT.project !== newFields.project) notes.push(`Đổi dự án: ${oldT.project} → ${newFields.project}.`);
    if(oldT.start !== newFields.start) notes.push(`Đổi ngày bắt đầu: ${fmtDate(oldT.start)} → ${fmtDate(newFields.start)}.`);
    if(oldT.due !== newFields.due) notes.push(`Đổi hạn hoàn thành: ${fmtDate(oldT.due)} → ${fmtDate(newFields.due)}.`);
    if(oldT.priority !== newFields.priority) notes.push(`Đổi mức ưu tiên: ${priorityLabel(oldT.priority)} → ${priorityLabel(newFields.priority)}.`);
    if(oldT.status !== newFields.status) notes.push(`Đổi trạng thái: ${statusLabel(oldT.status)} → ${statusLabel(newFields.status)}.`);
    return notes;
  }

  function seedTasks(){
    const off = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
    const mkActivity = () => [{id:uid(), text:'Đã tạo công việc.', time: nowISO()}];
    const list = [
      {id:uid(), title:'Xây dựng bộ nhận diện thương hiệu', project:'Sản phẩm mới', description:'Thiết kế logo, bảng màu và font chữ cho thương hiệu mới.', start:off(-2), due:off(4), priority:'high', status:'doing',
        subtasks:[
          {id:uid(), title:'Phác thảo logo', due:off(1), done:true},
          {id:uid(), title:'Chọn bảng màu & font chữ', due:off(3), done:false},
          {id:uid(), title:'Bộ quy chuẩn thương hiệu (Brand Guideline)', due:off(6), done:false}
        ],
        comments:[{id:uid(), text:'Khách hàng muốn xem thêm 2 phương án logo nữa.', time:new Date(Date.now()-3*3600e3).toISOString()}],
        activity: mkActivity()
      },
      {id:uid(), title:'Thiết kế bài đăng mạng xã hội tuần', project:'Social Media', description:'', start:off(0), due:off(2), priority:'med', status:'todo', subtasks:[], comments:[], activity: mkActivity()},
      {id:uid(), title:'In ấn brochure sự kiện', project:'Print', description:'', start:off(-5), due:off(-1), priority:'high', status:'doing', subtasks:[], comments:[], activity: mkActivity()},
      {id:uid(), title:'Tái định vị thương hiệu sản phẩm', project:'Repositioning', description:'', start:off(1), due:off(9), priority:'med', status:'todo', subtasks:[], comments:[], activity: mkActivity()},
      {id:uid(), title:'Duyệt bản in danh thiếp', project:'Print', description:'', start:off(-6), due:off(-3), priority:'low', status:'done', subtasks:[], comments:[], activity: mkActivity()},
    ];
    list.forEach(t=> syncTaskDueWithSubtasks(t));
    return list;
  }

  // ---------- Stats ----------
  function renderStats(){
    const total = tasks.length;
    const done = tasks.filter(t=>t.status==='done').length;
    const doing = tasks.filter(t=>t.status==='doing').length;
    const overdue = tasks.filter(t=> t.status!=='done' && t.due < todayStr()).length;
    const pct = total ? Math.round(done/total*100) : 0;

    $('#statsRow').innerHTML = `
      <div class="stat-card accent">
        <div class="num">${total}</div>
        <div class="lbl">Tổng công việc</div>
      </div>
      <div class="stat-card">
        <div class="num">${pct}%</div>
        <div class="lbl">Hoàn thành</div>
      </div>
      <div class="stat-card amber">
        <div class="num">${doing}</div>
        <div class="lbl">Đang thực hiện</div>
      </div>
      <div class="stat-card red">
        <div class="num">${overdue}</div>
        <div class="lbl">Quá hạn</div>
      </div>
    `;
  }

  // ---------- Filters ----------
  function currentFilters(){
    return {
      project: $('#filterProject').value,
      status: $('#filterStatus').value
    };
  }
  function filteredTasks(){
    const f = currentFilters();
    return tasks.filter(t=>{
      if(f.project!=='all' && t.project!==f.project) return false;
      if(f.status==='all') return true;
      if(f.status==='overdue') return t.status!=='done' && t.due < todayStr();
      return t.status === f.status;
    });
  }
  function renderProjectFilter(){
    const sel = $('#filterProject');
    const projects = Array.from(new Set(tasks.map(t=>t.project))).sort();
    const cur = sel.value || 'all';
    sel.innerHTML = `<option value="all">Tất cả dự án</option>` +
      projects.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    if(projects.includes(cur)) sel.value = cur;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Views ----------
  function render(){
    renderStats();
    renderProjectFilter();
    const root = $('#viewRoot');
    const list = filteredTasks();
    if(tasks.length === 0){
      root.innerHTML = `<div class="empty"><h3>Chưa có công việc nào</h3><p>Nhấn "Thêm công việc" để bắt đầu lên lịch trình của bạn.</p></div>`;
      return;
    }
    if(list.length === 0){
      root.innerHTML = `<div class="empty"><h3>Không có kết quả</h3><p>Thử đổi bộ lọc dự án hoặc trạng thái.</p></div>`;
      return;
    }
    if(currentView === 'runway') renderRunway(root, list);
    else if(currentView === 'board') renderBoard(root, list);
    else renderList(root, list);
  }

  function renderRunway(root, list){
    const today = todayStr();
    let minStart = list.reduce((m,t)=> t.start<m?t.start:m, list[0].start);
    let maxDue = list.reduce((m,t)=> t.due>m?t.due:m, list[0].due);
    if(today < minStart) minStart = today;
    if(today > maxDue) maxDue = today;
    const start = new Date(minStart+'T00:00:00'); start.setDate(start.getDate()-2);
    const end = new Date(maxDue+'T00:00:00'); end.setDate(end.getDate()+3);
    const totalDays = Math.max(1, Math.round((end-start)/86400000)+1);
    const dow = ['CN','T2','T3','T4','T5','T6','T7'];

    let daysHtml = '';
    for(let i=0;i<totalDays;i++){
      const d = new Date(start); d.setDate(d.getDate()+i);
      const ds = d.toISOString().slice(0,10);
      const isToday = ds === today;
      const isWeekend = d.getDay()===0 || d.getDay()===6;
      daysHtml += `<div class="runway-day ${isToday?'today':''} ${isWeekend?'weekend':''}">
        <span class="dow">${dow[d.getDay()]}</span>${d.getDate()}
      </div>`;
    }

    let rowsHtml = '';
    list.forEach(t=>{
      const s = new Date(t.start+'T00:00:00');
      const offsetDays = Math.round((s-start)/86400000);
      const spanDays = Math.max(1, daysBetween(t.start, t.due)+1);
      const color = t.status==='done' ? '#2F7D5C' : (t.priority==='high' ? '#C13F3F' : projectColor(t.project));
      const left = offsetDays*38;
      const width = spanDays*38 - 4;
      rowsHtml += `
        <div class="runway-row">
          <div class="runway-taskname">
            <div class="t-title">${escapeHtml(t.title)}</div>
            <div class="t-project"><span class="sw" style="background:${projectColor(t.project)}"></span>${escapeHtml(t.project)}</div>
          </div>
          <div class="runway-lane" style="min-width:${totalDays*38}px;">
            <div class="lane-inner">
              <div class="runway-bar" data-id="${t.id}" style="left:${left}px;width:${width}px;background:${color};"></div>
            </div>
          </div>
        </div>`;
    });

    root.innerHTML = `
      <div class="runway">
        <div class="runway-scroll">
          <div style="min-width:${220+totalDays*38}px;">
            <div class="runway-head">
              <div class="runway-labelcol">Công việc</div>
              <div class="runway-days">${daysHtml}</div>
            </div>
            ${rowsHtml}
          </div>
        </div>
      </div>
    `;
    $$('.runway-bar', root).forEach(el=>{
      el.addEventListener('click', ()=> openModal(el.dataset.id));
    });
  }

  function renderBoard(root, list){
    const cols = [
      {key:'todo', label:'Chưa làm'},
      {key:'doing', label:'Đang làm'},
      {key:'overdue', label:'Chậm deadline'},
      {key:'done', label:'Hoàn thành'}
    ];
    // Phân loại: quá hạn được tách thành cột riêng (ưu tiên trên trạng thái todo/doing);
    // Hoàn thành luôn thuộc cột Hoàn thành dù có quá hạn hay không.
    function colKeyOf(t){
      if(t.status === 'done') return 'done';
      if(t.due < todayStr()) return 'overdue';
      return t.status; // 'todo' hoặc 'doing'
    }

    root.innerHTML = `<div class="board">${cols.map(c=>{
      const items = list.filter(t=> colKeyOf(t) === c.key);
      const isOverdueCol = c.key === 'overdue';
      return `
        <div class="board-col ${isOverdueCol?'col-overdue':''}" data-status="${c.key}">
          <h4>${c.label} <span class="count">${items.length}</span></h4>
          <div class="board-col-body" data-status="${c.key}">
            ${items.map(t=>{
              const colorClass = 'card-' + cardColorKey(t);
              const prClass = t.priority==='high'?'pr-high':t.priority==='med'?'pr-med':'pr-low';
              const prLabel = t.priority==='high'?'Cao':t.priority==='med'?'TB':'Thấp';
              return `
                <div class="card ${colorClass}" draggable="true" data-id="${t.id}">
                  <div class="c-title">${escapeHtml(t.title)}</div>
                  ${t.description ? `<div class="c-desc">${escapeHtml(t.description)}</div>` : ''}
                  <div class="c-meta">
                    <span class="chip ${prClass}">${prLabel}</span>
                    <span class="c-date">${fmtDate(t.start)} → ${fmtDate(t.due)}</span>
                  </div>
                </div>`;
            }).join('') || `<div style="font-size:12px;color:var(--ink-soft);padding:10px 4px;">Không có công việc</div>`}
          </div>
        </div>`;
    }).join('')}</div>`;

    $$('.card', root).forEach(el=>{
      el.addEventListener('click', ()=>{
        if(el.dataset.justDragged){ delete el.dataset.justDragged; return; }
        openModal(el.dataset.id);
      });
      el.addEventListener('dragstart', (e)=>{
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', el.dataset.id);
        setTimeout(()=> el.classList.add('dragging'), 0);
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
      });
    });

    // Cột "Chậm deadline" là tự động (tính theo hạn chót), không nhận thả trực tiếp —
    // muốn hết quá hạn thì kéo sang "Hoàn thành" hoặc sửa lại hạn hoàn thành trong modal.
    $$('.board-col', root).forEach(col=>{
      const targetStatus = col.dataset.status;
      if(targetStatus === 'overdue') return;
      col.addEventListener('dragover', (e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        col.classList.add('drag-over');
      });
      col.addEventListener('dragleave', (e)=>{
        if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
      });
      col.addEventListener('drop', async (e)=>{
        e.preventDefault();
        col.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const t = tasks.find(x=>x.id===id);
        if(!t || t.status === targetStatus) return;
        const draggedEl = root.querySelector(`.card[data-id="${id}"]`);
        if(draggedEl) draggedEl.dataset.justDragged = '1';
        const prevStatus = t.status;
        t.status = targetStatus;
        addActivity(t, `Đổi trạng thái: ${statusLabel(prevStatus)} → ${statusLabel(targetStatus)}.`);
        render();
        const ok = await updateTaskRemote(id, t);
        if(!ok){ t.status = prevStatus; render(); }
      });
    });
  }

  function renderList(root, list){
    const sorted = [...list].sort((a,b)=> a.due.localeCompare(b.due));
    root.innerHTML = `
      <table class="tasklist">
        <thead><tr>
          <th>Công việc</th><th>Dự án</th><th>Bắt đầu</th><th>Hạn</th>
          <th>Ưu tiên</th><th>Trạng thái</th><th></th>
        </tr></thead>
        <tbody>
          ${sorted.map(t=>{
            const overdue = t.status!=='done' && t.due < todayStr();
            const prLabel = t.priority==='high'?'Cao':t.priority==='med'?'TB':'Thấp';
            const stLabel = t.status==='todo'?'Chưa làm':t.status==='doing'?'Đang làm':'Hoàn thành';
            return `
            <tr>
              <td>${escapeHtml(t.title)}</td>
              <td><span class="t-project"><span class="sw" style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${projectColor(t.project)};margin-right:5px;"></span>${escapeHtml(t.project)}</span></td>
              <td>${fmtDate(t.start)}</td>
              <td style="color:${overdue?'var(--red)':'inherit'};font-weight:${overdue?'600':'400'};">${fmtDate(t.due)}${overdue?' ⚠':''}</td>
              <td>${prLabel}</td>
              <td><span class="status-pill status-${t.status}">${stLabel}</span></td>
              <td><button class="icon-btn" data-id="${t.id}" title="Sửa">✎</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
    $$('.icon-btn', root).forEach(el=> el.addEventListener('click', ()=> openModal(el.dataset.id)));
    $$('table.tasklist tbody tr', root).forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.icon-btn')) return;
        const btn = row.querySelector('.icon-btn');
        if(btn) openModal(btn.dataset.id);
      });
    });
  }

  // ---------- Modal ----------
  function openModal(id){
    editingId = id || null;
    const t = id ? tasks.find(x=>x.id===id) : null;
    $('#modalTitle').textContent = t ? 'Sửa công việc' : 'Thêm công việc';
    $('#f-title').value = t ? t.title : '';
    $('#f-project').value = t ? t.project : '';
    $('#f-desc').value = t ? (t.description || '') : '';
    $('#f-start').value = t ? t.start : todayStr();
    $('#f-due').value = t ? t.due : todayStr();
    $('#f-priority').value = t ? t.priority : 'med';
    $('#f-status').value = t ? t.status : 'todo';
    $('#deleteBtn').style.display = t ? 'inline-block' : 'none';

    const extra = $('#modalExtra');
    const modalBox = $('#modalBox');
    $('#newSubtaskTitle').value = '';
    $('#newSubtaskDue').value = '';
    $('#newCommentText').value = '';
    if(t){
      extra.style.display = 'flex';
      modalBox.classList.add('wide');
      renderModalExtra(t);
    } else {
      extra.style.display = 'none';
      modalBox.classList.remove('wide');
    }

    $('#overlay').classList.add('open');
    $('#f-title').focus();
  }
  function closeModal(){
    $('#overlay').classList.remove('open');
    editingId = null;
  }

  async function saveFromModal(){
    const title = $('#f-title').value.trim();
    if(!title){ $('#f-title').focus(); return; }
    let project = $('#f-project').value.trim() || 'Chưa phân loại';
    const description = $('#f-desc').value.trim();
    let start = $('#f-start').value || todayStr();
    let due = $('#f-due').value || start;
    if(due < start) due = start;
    const priority = $('#f-priority').value;
    let status = $('#f-status').value;
    const fields = {title, project, description, start, due, priority, status};

    const saveBtn = $('#saveBtn');
    saveBtn.disabled = true;
    try{
      if(editingId){
        const t = tasks.find(x=>x.id===editingId);
        if(!t) return;
        const notes = diffActivity(t, fields);
        const updatedActivity = [...(t.activity||[])];
        notes.forEach(n => updatedActivity.push({id:uid(), text:n, time: nowISO()}));
        const fullFields = {...fields, subtasks: t.subtasks||[], comments: t.comments||[], activity: updatedActivity};
        const ok = await updateTaskRemote(editingId, fullFields);
        if(!ok) return;
        Object.assign(t, fields, {activity: updatedActivity});
      } else {
        const fields2 = {...fields, subtasks:[], comments:[], activity:[{id:uid(), text:'Đã tạo công việc.', time: nowISO()}]};
        const newTask = await addTaskRemote(fields2);
        if(!newTask) return;
        tasks.push(newTask);
      }
      closeModal();
      render();
    } finally {
      saveBtn.disabled = false;
    }
  }

  async function deleteTask(){
    if(!editingId) return;
    const ok = await deleteTaskRemote(editingId);
    if(!ok) return;
    tasks = tasks.filter(t=>t.id !== editingId);
    closeModal();
    render();
  }

  // ---------- Excel export ----------
  function statusLabel(s){ return s==='todo'?'Chưa làm':s==='doing'?'Đang làm':'Hoàn thành'; }
  function priorityLabel(p){ return p==='high'?'Cao':p==='med'?'Trung bình':'Thấp'; }
  function dueStateLabel(t){
    return {green:'Hoàn thành', red:'Chậm deadline', yellow:'Sắp tới hạn', blue:'Đúng hạn'}[cardColorKey(t)];
  }

  function taskRow(t){
    return {
      'Tên công việc': t.title,
      'Dự án': t.project,
      'Mô tả nội dung': t.description || '',
      'Ngày bắt đầu': t.start,
      'Hạn hoàn thành': t.due,
      'Mức ưu tiên': priorityLabel(t.priority),
      'Trạng thái công việc': statusLabel(t.status),
      'Tình trạng hạn chót': dueStateLabel(t)
    };
  }

  function exportToExcel(){
    if(typeof XLSX === 'undefined'){
      alert('Không thể tải thư viện xuất Excel. Vui lòng kiểm tra kết nối mạng và thử lại.');
      return;
    }
    if(tasks.length === 0){
      alert('Chưa có công việc nào để xuất.');
      return;
    }
    const wb = XLSX.utils.book_new();

    const total = tasks.length;
    const done = tasks.filter(t=>t.status==='done').length;
    const doing = tasks.filter(t=>t.status==='doing').length;
    const todo = tasks.filter(t=>t.status==='todo').length;
    const overdue = tasks.filter(t=> t.status!=='done' && t.due < todayStr()).length;
    const projects = Array.from(new Set(tasks.map(t=>t.project))).sort();

    const overviewRows = [
      {'Chỉ số': 'Tổng số công việc', 'Giá trị': total},
      {'Chỉ số': 'Đã hoàn thành', 'Giá trị': done},
      {'Chỉ số': 'Đang thực hiện', 'Giá trị': doing},
      {'Chỉ số': 'Chưa làm', 'Giá trị': todo},
      {'Chỉ số': 'Chậm deadline', 'Giá trị': overdue},
      {'Chỉ số': 'Tỷ lệ hoàn thành', 'Giá trị': total ? Math.round(done/total*100)+'%' : '0%'},
    ];
    const wsOverview = XLSX.utils.json_to_sheet(overviewRows, {skipHeader:false});
    wsOverview['!cols'] = [{wch:28},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsOverview, 'Tổng quan');

    // Sheet riêng: trạng thái chi tiết theo từng dự án, để thấy rõ dự án nào đang ổn / đang chậm
    const projectStatusRows = projects.map(p=>{
      const items = tasks.filter(t=>t.project===p);
      const pTotal = items.length;
      const pDone = items.filter(t=>t.status==='done').length;
      const pDoing = items.filter(t=>t.status==='doing').length;
      const pTodo = items.filter(t=>t.status==='todo').length;
      const pOverdue = items.filter(t=> t.status!=='done' && t.due < todayStr()).length;
      return {
        'Dự án': p,
        'Tổng số công việc': pTotal,
        'Chưa làm': pTodo,
        'Đang làm': pDoing,
        'Chậm deadline': pOverdue,
        'Hoàn thành': pDone,
        'Tỷ lệ hoàn thành': pTotal ? Math.round(pDone/pTotal*100)+'%' : '0%'
      };
    });
    const wsProjectStatus = XLSX.utils.json_to_sheet(projectStatusRows);
    wsProjectStatus['!cols'] = [{wch:24},{wch:16},{wch:12},{wch:12},{wch:14},{wch:12},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsProjectStatus, 'Trạng thái theo dự án');

    const allSorted = [...tasks].sort((a,b)=> a.due.localeCompare(b.due));
    const wsAll = XLSX.utils.json_to_sheet(allSorted.map(taskRow));
    wsAll['!cols'] = [{wch:32},{wch:18},{wch:34},{wch:12},{wch:14},{wch:12},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsAll, 'Toàn bộ công việc');

    // Sheet riêng cho Công việc con (phần duy nhất trong các phần mới được đưa vào Excel)
    const subtaskRows = [];
    tasks.forEach(t=>{
      (t.subtasks||[]).forEach(s=>{
        subtaskRows.push({
          'Công việc cha': t.title,
          'Dự án': t.project,
          'Tên công việc con': s.title,
          'Hạn công việc con': s.due || '',
          'Trạng thái': s.done ? 'Hoàn thành' : 'Chưa xong'
        });
      });
    });
    const wsSubtasks = subtaskRows.length
      ? XLSX.utils.json_to_sheet(subtaskRows)
      : XLSX.utils.json_to_sheet([{'Ghi chú':'Không có công việc con nào'}]);
    wsSubtasks['!cols'] = [{wch:32},{wch:18},{wch:32},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsSubtasks, 'Công việc con');

    // Sheet riêng cho các công việc đang chậm deadline, xếp theo mức độ trễ
    const overdueRows = tasks
      .filter(t=> t.status!=='done' && t.due < todayStr())
      .sort((a,b)=> a.due.localeCompare(b.due))
      .map(t=> ({...taskRow(t), 'Số ngày đã trễ': daysBetween(t.due, todayStr())}));
    const wsOverdue = overdueRows.length
      ? XLSX.utils.json_to_sheet(overdueRows)
      : XLSX.utils.json_to_sheet([{'Ghi chú':'Không có công việc chậm deadline'}]);
    wsOverdue['!cols'] = [{wch:32},{wch:18},{wch:34},{wch:12},{wch:14},{wch:12},{wch:16},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsOverdue, 'Chậm deadline');

    const statusGroups = [
      {key:'todo', name:'Chưa làm'},
      {key:'doing', name:'Đang làm'},
      {key:'done', name:'Hoàn thành'}
    ];
    statusGroups.forEach(g=>{
      const rows = tasks.filter(t=>t.status===g.key)
        .sort((a,b)=> a.due.localeCompare(b.due))
        .map(taskRow);
      const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.json_to_sheet([{'Ghi chú':'Không có công việc'}]);
      ws['!cols'] = [{wch:32},{wch:18},{wch:34},{wch:12},{wch:14},{wch:12},{wch:16},{wch:16}];
      XLSX.utils.book_append_sheet(wb, ws, g.name);
    });

    projects.forEach(p=>{
      const rows = tasks.filter(t=>t.project===p)
        .sort((a,b)=> a.due.localeCompare(b.due))
        .map(taskRow);
      const safeName = p.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28) || 'Dự án';
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{wch:32},{wch:18},{wch:34},{wch:12},{wch:14},{wch:12},{wch:16},{wch:16}];
      XLSX.utils.book_append_sheet(wb, ws, safeName);
    });

    const dateStr = todayStr();
    XLSX.writeFile(wb, `lich-trinh-cong-viec_${dateStr}.xlsx`);
  }

  // ---------- Events ----------
  $('#exportBtn').addEventListener('click', exportToExcel);
  $('#openAdd').addEventListener('click', ()=> openModal(null));
  $('#cancelBtn').addEventListener('click', closeModal);
  $('#saveBtn').addEventListener('click', saveFromModal);
  $('#deleteBtn').addEventListener('click', deleteTask);
  $('#overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  $('#filterProject').addEventListener('change', render);
  $('#filterStatus').addEventListener('change', render);
  $('#addSubtaskBtn').addEventListener('click', handleAddSubtask);
  $('#newSubtaskTitle').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); handleAddSubtask(); } });
  $('#addCommentBtn').addEventListener('click', handleAddComment);
  $$('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      $$('.tab').forEach(x=>x.classList.remove('active'));
      tab.classList.add('active');
      currentView = tab.dataset.view;
      render();
    });
  });

  $('#todayLabel').textContent = new Date().toLocaleDateString('vi-VN',{weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'});

  loadTasks();
})();
</script>
